[project]
name = "psg-fatigue"
version = "0.1.0"
description = "PSG under Luis Enrique: does fixture congestion beat the betting market? Reproducible data pipeline."
readme = "README.md"
authors = [
    { name = "Sacha Nardoux", email = "snardoux@albertschool.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "mwparserfromhell>=0.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.32",
]

[project.scripts]
psg-fatigue = "psg_fatigue.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8",
    "ruff>=0.6",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# SPEC §14 rule set, plus stricter families the code already satisfies: comprehensions (C4),
# pytest style (PT), pathlib (PTH), returns (RET), unused arguments (ARG),
# commented-out code (ERA), misc. lints (PIE).
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N",
    "C4", "PT", "PTH", "RET", "ARG", "ERA", "PIE",
]

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true  # not part of --strict: flags dead branches

[tool.pytest.ini_options]
testpaths = ["tests"]
